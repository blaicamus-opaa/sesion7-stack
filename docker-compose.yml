services:
  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - wp_data:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    depends_on:
      - wordpress

  wordpress:
    image: wordpress:6.7-php8.3-fpm
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        $$proto = (!empty($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strtolower($$_SERVER['HTTP_X_FORWARDED_PROTO']) === 'https') || (!empty($$_SERVER['HTTPS']) && $$_SERVER['HTTPS'] !== 'off') ? 'https' : 'http';
        $$host = !empty($$_SERVER['HTTP_X_FORWARDED_HOST']) ? $$_SERVER['HTTP_X_FORWARDED_HOST'] : ($$_SERVER['HTTP_HOST'] ?? 'localhost:8080');
        if (strpos($$host, ',') !== false) { $$host = trim(explode(',', $$host)[0]); }
        define('WP_HOME', $$proto . '://' . $$host);
        define('WP_SITEURL', $$proto . '://' . $$host);
    volumes:
      - wp_data:/var/www/html
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - db

  db:
    image: mariadb:11
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["herramientas"]
    user: "33:33"
    working_dir: /var/www/html
    volumes:
      - wp_data:/var/www/html
      - ./datos:/datos:ro
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
    depends_on:
      - db

volumes:
  wp_data:
  db_data:

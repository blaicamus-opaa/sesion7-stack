# Define el bloque de servidor virtual para atender peticiones web
server {
    # Escucha peticiones HTTP estándar en el puerto 80 dentro del contenedor
    listen 80;
    # Acepta cualquier nombre de host o dominio recibido
    server_name _;

    # Directorio raíz donde están ubicados los archivos de WordPress
    root /var/www/html;
    # Archivo por defecto que se carga al acceder a un directorio
    index index.php;

    # Tamaño máximo permitido para peticiones y subida de archivos
    client_max_body_size 64M;

    # Bloque de ubicación principal para gestionar las rutas del sitio
    location / {
        # Intenta servir el archivo o directorio solicitado; si no existe, reenvía a index.php manteniendo los argumentos
        try_files $uri $uri/ /index.php?$args;
    # Cierra el bloque location principal
    }

    # Procesa todas las peticiones a archivos con extensión .php
    location ~ \.php$ {
        # Importa los parámetros estándar FastCGI requeridos por PHP
        include fastcgi_params;
        # Reenvía la ejecución PHP al servicio wordpress por el puerto FastCGI 9000
        fastcgi_pass wordpress:9000;
        # Ruta absoluta del script PHP que debe procesar PHP-FPM
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # Cierra el bloque location para archivos PHP
    }
# Cierra el bloque server
}

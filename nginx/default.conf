# Define el bloque de servidor virtual para atender peticiones web
server {
    # Escucha peticiones HTTP estándar en el puerto 80 dentro del contenedor
    listen 80;
    # Acepta cualquier nombre de host o dominio recibido
    server_name _;

    # Oculta el número de versión de Nginx en las cabeceras HTTP y páginas de error
    server_tokens off;
    # Evita que el navegador interprete archivos con un tipo MIME distinto al declarado
    add_header X-Content-Type-Options "nosniff" always;
    # Impide que el sitio se incruste en iframes de otros dominios (protección contra clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Directorio raíz donde están ubicados los archivos de WordPress
    root /var/www/html;
    # Archivo por defecto que se carga al acceder a un directorio
    index index.php;

    # Tamaño máximo permitido para peticiones y subida de archivos
    client_max_body_size 64M;

    # Bloque de ubicación principal para gestionar las rutas del sitio
    location / {
        # Intenta servir el archivo o directorio solicitado; si no existe, reenvía a index.php manteniendo los argumentos
        try_files $uri $uri/ /index.php?$args;
    # Cierra el bloque location principal
    }

    # Bloquea el acceso externo al endpoint XML-RPC para evitar ataques de fuerza bruta y amplificación
    location = /xmlrpc.php {
        # Deniega todas las peticiones entrantes devolviendo HTTP 403 Forbidden
        deny all;
    # Cierra el bloque de bloqueo de xmlrpc.php
    }

    # Bloquea el acceso directo al archivo de configuración de WordPress
    location = /wp-config.php {
        # Deniega cualquier intento de acceso devolviendo HTTP 403 Forbidden
        deny all;
    # Cierra el bloque de bloqueo de wp-config.php
    }

    # Bloquea la ejecución de cualquier script PHP subido dentro del directorio uploads (debe ir antes de ~ \.php$)
    location ~ ^/wp-content/uploads/.*\.php$ {
        # Deniega la petición devolviendo HTTP 403 Forbidden
        deny all;
    # Cierra el bloque de bloqueo de PHP en uploads
    }

    # Procesa todas las peticiones a archivos con extensión .php
    location ~ \.php$ {
        # Importa los parámetros estándar FastCGI requeridos por PHP
        include fastcgi_params;
        # Reenvía la ejecución PHP al servicio wordpress por el puerto FastCGI 9000
        fastcgi_pass wordpress:9000;
        # Ruta absoluta del script PHP que debe procesar PHP-FPM
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # Cierra el bloque location para archivos PHP
    }
# Cierra el bloque server
}
